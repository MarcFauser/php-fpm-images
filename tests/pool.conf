; Test pool for tests/test-image.sh, built like the pools on the server: Unix socket,
; ondemand, open_basedir limited to the site and its own temp directory, the six ways to
; start a program disabled. Mounted as zz-custom.conf, the name the server uses.
[www]
listen = /run/php/test.sock
listen.owner = www-data
listen.group = www-data
; 0666 only in the test: the FastCGI client runs as the runner's user, not as www-data
; (on the server: 0660, and Caddy is in the www-data group).
listen.mode = 0666

access.log = /run/php/access.log
php_admin_value[error_log] = /run/php/error.log
php_admin_value[open_basedir] = /srv/site/:/run/php/tmp/
php_admin_value[sys_temp_dir] = /run/php/tmp
php_admin_value[upload_tmp_dir] = /run/php/tmp
php_admin_value[session.save_path] = /run/php/tmp
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,popen,proc_open

pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 500
